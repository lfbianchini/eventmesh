{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "eventmesh.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-password: {{ required "secrets.databasePassword is required" .Values.secrets.databasePassword | quote }}
  encryption-key: {{ required "secrets.encryptionKey is required" .Values.secrets.encryptionKey | quote }}
{{- end }}
