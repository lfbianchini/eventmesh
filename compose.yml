services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventmesh
      POSTGRES_USER: eventmesh
      POSTGRES_PASSWORD: eventmesh
    ports:
      - "${EVENTMESH_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventmesh -d eventmesh"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - eventmesh-postgres:/var/lib/postgresql/data

  kafka:
    image: apache/kafka-native:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${EVENTMESH_KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  eventmesh:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      EVENTMESH_DB_URL: jdbc:postgresql://postgres:5432/eventmesh
      EVENTMESH_DB_USERNAME: eventmesh
      EVENTMESH_DB_PASSWORD: eventmesh
      EVENTMESH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${EVENTMESH_PORT:-8088}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  eventmesh-postgres:
