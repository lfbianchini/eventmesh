spring:
  application:
    name: eventmesh
  datasource:
    url: ${EVENTMESH_DB_URL:jdbc:postgresql://localhost:5433/eventmesh}
    username: ${EVENTMESH_DB_USERNAME:eventmesh}
    password: ${EVENTMESH_DB_PASSWORD:eventmesh}
    hikari:
      maximum-pool-size: ${EVENTMESH_DB_POOL_SIZE:10}
      connection-timeout: 3000
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${EVENTMESH_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    admin:
      fail-fast: false
    producer:
      acks: all
      retries: 2147483647
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never

springdoc:
  api-docs:
    enabled: ${EVENTMESH_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${EVENTMESH_API_DOCS_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: ${EVENTMESH_TRACING_ENABLED:false}
    sampling:
      probability: ${EVENTMESH_TRACE_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${EVENTMESH_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${EVENTMESH_ENVIRONMENT:local}
  info:
    env:
      enabled: true

info:
  app:
    name: EventMesh
    delivery-gate: D5-portfolio-complete

eventmesh:
  observability:
    scheduling-enabled: ${EVENTMESH_METRICS_SCHEDULING_ENABLED:true}
    snapshot-interval: ${EVENTMESH_METRICS_SNAPSHOT_INTERVAL:5s}
  security:
    encryption-key: ${EVENTMESH_SECRET_ENCRYPTION_KEY:}
  kafka:
    create-topics: ${EVENTMESH_KAFKA_CREATE_TOPICS:true}
  outbox:
    scheduling-enabled: ${EVENTMESH_OUTBOX_SCHEDULING_ENABLED:true}
    batch-size: ${EVENTMESH_OUTBOX_BATCH_SIZE:50}
    poll-interval: ${EVENTMESH_OUTBOX_POLL_INTERVAL:500ms}
    lease-duration: ${EVENTMESH_OUTBOX_LEASE_DURATION:30s}
    send-timeout: ${EVENTMESH_OUTBOX_SEND_TIMEOUT:10s}
    retry-base-delay: ${EVENTMESH_OUTBOX_RETRY_BASE_DELAY:1s}
    retry-max-delay: ${EVENTMESH_OUTBOX_RETRY_MAX_DELAY:1m}
  webhooks:
    kafka-listener-enabled: ${EVENTMESH_WEBHOOK_KAFKA_LISTENER_ENABLED:true}
    scheduling-enabled: ${EVENTMESH_WEBHOOK_SCHEDULING_ENABLED:true}
    allow-private-endpoints: ${EVENTMESH_ALLOW_PRIVATE_WEBHOOK_ENDPOINTS:false}
    batch-size: ${EVENTMESH_WEBHOOK_BATCH_SIZE:25}
    max-attempts: ${EVENTMESH_WEBHOOK_MAX_ATTEMPTS:5}
    poll-interval: ${EVENTMESH_WEBHOOK_POLL_INTERVAL:500ms}
    lease-duration: ${EVENTMESH_WEBHOOK_LEASE_DURATION:30s}
    connect-timeout: ${EVENTMESH_WEBHOOK_CONNECT_TIMEOUT:3s}
    request-timeout: ${EVENTMESH_WEBHOOK_REQUEST_TIMEOUT:5s}
    retry-base-delay: ${EVENTMESH_WEBHOOK_RETRY_BASE_DELAY:1s}
    retry-max-delay: ${EVENTMESH_WEBHOOK_RETRY_MAX_DELAY:5m}
