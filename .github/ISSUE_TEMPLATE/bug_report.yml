name: Bug report
description: Report reproducible behavior that violates a documented contract
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets and customer data. Include the smallest reproduction you can.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the relevant response, state, or log excerpt?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Which documented contract or invariant should have held?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List exact commands, inputs, and failure injection.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release tag
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Java, Docker, PostgreSQL, and Kafka versions
    validations:
      required: true
