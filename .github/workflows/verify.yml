name: verify

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.local.yml config --quiet
          docker compose -f compose.yml -f compose.local.yml \
            -f compose.observability.yml --profile demo \
            --profile observability config --quiet

      - name: Validate Helm chart
        run: |
          helm lint deploy/helm/eventmesh
          helm template eventmesh deploy/helm/eventmesh \
            --values deploy/kubernetes/dev-values.yaml >/dev/null

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build OCI image
        run: docker build --tag eventmesh:${{ github.sha }} .
